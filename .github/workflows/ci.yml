name: examples check

# Syntax-only: no network, no API key. Keeps every example runnable as the catalogue changes.
on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Python examples compile
        run: python -m py_compile examples/*.py
      - name: Node examples parse
        run: for f in examples/*.mjs; do node --check "$f"; done
      - name: Shell examples parse
        run: for f in examples/*.sh; do bash -n "$f"; done
      - name: No secrets committed
        run: |
          ! grep -rnE 'sk-[A-Za-z0-9]{20,}' --exclude-dir=.git . || (echo "looks like a real key" && exit 1)
